    <title>Sideline Sports &amp; Entertainment</title>
    <meta name="description" content="Original reporting, in-depth analysis, and compelling storytelling. Sports and entertainment journalism reimagined." />
    <meta name="keywords" content="sports journalism, sports media, sports entertainment, NFL coverage, NBA analysis, sports podcast, sideline sports, sports news, sports reporting, entertainment news" />

    <link rel="canonical" href="https://sideline-se.com/" />
    <link rel="icon" type="image/jpeg" href="/media/favicon-logo.jpg" />
    <link rel="apple-touch-icon" href="/media/favicon-logo.jpg" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sideline-se.com/" />
    <meta property="og:title" content="Sideline Sports &amp; Entertainment" />
    <meta property="og:description" content="Original reporting, in-depth analysis, and compelling storytelling. Sports and entertainment journalism reimagined." />
    <meta property="og:image" content="https://sideline-se.com/media/favicon-logo.jpg" />
    <meta property="og:site_name" content="Sideline Sports &amp; Entertainment" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sideline-se.com/" />
    <meta name="twitter:title" content="Sideline Sports &amp; Entertainment" />
    <meta name="twitter:description" content="Original reporting, in-depth analysis, and compelling storytelling. Sports and entertainment journalism reimagined." />
    <meta name="twitter:image" content="https://sideline-se.com/media/favicon-logo.jpg" />

    <!--
      Social preview troubleshooting:
      - Share the exact URL where the site is live (crawlers fetch that URL).
      - Clear cache: Facebook https://developers.facebook.com/tools/debug/ , Twitter https://cards-dev.twitter.com/validator
      - Ensure public/logo-180.png exists so /logo-180.png is served. For a larger card use a 1200x630 image as public/og-image.png and change the image path above to /og-image.png
    -->
    <script>
      (function() {
        var o = window.location.origin;
        var img = o + '/media/favicon-logo.jpg';
        var base = o + '/';
        function set(el, attr, val) { if (el) el.setAttribute(attr, val); }
        set(document.querySelector('meta[property="og:url"]'), 'content', base);
        set(document.querySelector('meta[property="og:image"]'), 'content', img);
        set(document.querySelector('meta[name="twitter:url"]'), 'content', base);
        set(document.querySelector('meta[name="twitter:image"]'), 'content', img);
        set(document.querySelector('link[rel="canonical"]'), 'href', base);
      })();
    </script>
